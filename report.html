<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売上・日計レポート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK (Compat版 CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @media print {
      body { background-color: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .page-break { page-break-inside: avoid; }
      @page { size: A4 portrait; margin: 12mm; }
    }
    @media screen {
      .print-only { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans select-none print:bg-white print:text-black">

  <!-- ==================== スティッキーヘッダー（印刷時非表示） ==================== -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 no-print">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold flex items-center gap-1 transition">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>受付へ戻る</span>
        </a>
        <div class="flex items-center gap-2">
          <div class="p-1.5 rounded-lg bg-amber-100 text-amber-800">
            <i data-lucide="file-text" class="w-4 h-4"></i>
          </div>
          <span class="text-sm font-bold text-slate-900">日次売上集計・PDF帳票</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-mono text-slate-600">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
          <span id="disp-today">----/--/--</span>
        </div>
        <button onclick="triggerPrintPDF()" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 active:scale-95 text-white text-xs font-bold shadow-sm transition">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
          <span>PDF出力 / 印刷</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== メインレポートエリア ==================== -->
  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- 印刷専用公式レポート表題（A4用紙上部に出力） -->
    <div class="print-only border-b-2 border-slate-800 pb-3 mb-4">
      <div class="flex justify-between items-end">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900">日次売上報告書・注文台帳</h1>
          <p class="text-xs text-slate-500 mt-1 font-mono">印刷日時: <span id="print-timestamp"></span></p>
        </div>
        <div class="text-right">
          <p class="text-xs font-bold text-slate-500">対象営業日</p>
          <p class="text-base font-mono font-bold text-amber-900" id="print-date">----/--/--</p>
        </div>
      </div>
    </div>

    <!-- KPIカードグリッド -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 page-break">
      <!-- 総売上高 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500">
          <span class="text-xs font-bold">総売上高</span>
          <i data-lucide="coins" class="w-4 h-4 text-amber-700"></i>
        </div>
        <div class="mt-2">
          <span class="text-2xl font-black font-mono tracking-tight text-slate-900">¥<span id="kpi-total-sales">0</span></span>
          <span class="text-[10px] text-slate-400 block mt-0.5">有効客数: <span id="kpi-order-count">0</span> 組</span>
        </div>
      </div>

      <!-- 総食数 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500">
          <span class="text-xs font-bold">販売総食数</span>
          <i data-lucide="trending-up" class="w-4 h-4 text-emerald-600"></i>
        </div>
        <div class="mt-2">
          <span class="text-2xl font-black font-mono tracking-tight text-slate-900"><span id="kpi-dish-count">0</span><span class="text-sm font-normal text-slate-500 ml-1">杯</span></span>
          <span class="text-[10px] text-slate-400 block mt-0.5">平均客単価: ¥<span id="kpi-avg-price">0</span></span>
        </div>
      </div>

      <!-- 店内食数 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500">
          <span class="text-xs font-bold">店内飲食</span>
          <i data-lucide="store" class="w-4 h-4 text-sky-600"></i>
        </div>
        <div class="mt-2">
          <span class="text-2xl font-black font-mono tracking-tight text-slate-900"><span id="kpi-dinein-count">0</span><span class="text-sm font-normal text-slate-500 ml-1">杯</span></span>
          <span class="text-[10px] text-slate-400 block mt-0.5 font-mono">構成比: <span id="kpi-dinein-rate">0</span>%</span>
        </div>
      </div>

      <!-- 持ち帰り食数 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-500">
          <span class="text-xs font-bold">持ち帰りパック</span>
          <i data-lucide="shopping-bag" class="w-4 h-4 text-indigo-600"></i>
        </div>
        <div class="mt-2">
          <span class="text-2xl font-black font-mono tracking-tight text-slate-900"><span id="kpi-takeout-count">0</span><span class="text-sm font-normal text-slate-500 ml-1">杯</span></span>
          <span class="text-[10px] text-slate-400 block mt-0.5 font-mono">構成比: <span id="kpi-takeout-rate">0</span>%</span>
        </div>
      </div>
    </section>

    <!-- 品目別出数・小計テーブル -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4 page-break">
      <!-- カレー別内訳 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-3 flex items-center justify-between">
          <span>カレー・ライス別 内訳</span>
          <span class="text-[11px] font-normal text-slate-400">税込計算</span>
        </h2>
        <table class="w-full text-xs text-left">
          <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
            <tr>
              <th class="py-2 px-3">商品種別</th>
              <th class="py-2 px-3 text-right">単価</th>
              <th class="py-2 px-3 text-right">数量</th>
              <th class="py-2 px-3 text-right">小計</th>
            </tr>
          </thead>
          <tbody id="tbody-curry-summary" class="divide-y divide-slate-100 font-mono"></tbody>
        </table>
      </div>

      <!-- トッピング・ドリンク内訳 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-3 flex items-center justify-between">
          <span>トッピング・ドリンク 内訳</span>
          <span class="text-[11px] font-normal text-slate-400">付加売上</span>
        </h2>
        <table class="w-full text-xs text-left">
          <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
            <tr>
              <th class="py-2 px-3">アイテム名</th>
              <th class="py-2 px-3 text-right">単価</th>
              <th class="py-2 px-3 text-right">出数</th>
              <th class="py-2 px-3 text-right">小計</th>
            </tr>
          </thead>
          <tbody id="tbody-toppings-summary" class="divide-y divide-slate-100 font-mono"></tbody>
        </table>
      </div>
    </section>

    <!-- 注文明細一覧 -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden page-break">
      <div class="p-3.5 border-b border-slate-200 flex justify-between items-center bg-slate-50/50">
        <div class="flex items-center gap-2">
          <h3 class="text-xs font-bold text-slate-900">受付伝票明細一覧</h3>
          <span class="text-[11px] text-slate-500 font-mono" id="disp-order-total-count">(全0件)</span>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
            <tr>
              <th class="py-2.5 px-3 w-16">番号</th>
              <th class="py-2.5 px-3 w-32">お名前</th>
              <th class="py-2.5 px-3 w-20">案内枠</th>
              <th class="py-2.5 px-3">注文構成明細</th>
              <th class="py-2.5 px-3 w-20 text-center">状態</th>
              <th class="py-2.5 px-3 w-24 text-right">小計金額</th>
            </tr>
          </thead>
          <tbody id="tbody-order-details" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // ===== Firebase 設定 =====
    const firebaseConfig = {
      apiKey: "AIzaSyC1C4LIZpiiEA6PohPTC-XsI4ayfWgzBpo",
      authDomain: "curry-ticket-system.firebaseapp.com",
      projectId: "curry-ticket-system",
      storageBucket: "curry-ticket-system.firebasestorage.app",
      messagingSenderId: "295266310086",
      appId: "1:295266310086:web:a86117b637fd7fb4a0c4c7",
      measurementId: "G-QY5GDDWG5Y"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const MENU_PRICES = {
      "チキン": 1500,
      "ポーク": 1500,
      "限定": 1600,
      "大盛": 150,
      "キーマ": 350,
      "アチャール": 350,
      "うずら": 150,
      "パクチー": 200,
      "豆カレー": 350,
      "サラダ": 200,
      "ピクルス": 100,
      "ビール": 450,
      "チャイ": 350
    };

    let orders = [];

    function init() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById("disp-today").innerText = todayStr;
      document.getElementById("print-date").innerText = todayStr;
      document.getElementById("print-timestamp").innerText = new Date().toLocaleString("ja-JP");

      // Firestoreからリアルタイム同期
      db.collection("orders").onSnapshot((snapshot) => {
        orders = [];
        snapshot.forEach((doc) => {
          orders.push(doc.data());
        });
        orders.sort((a, b) => a.id - b.id);
        calculateAndRender();
      }, (error) => {
        console.error("Firestore読み込みエラー:", error);
      });
    }

    function calculateAndRender() {
      // 取消を除外した有効注文
      const validOrders = orders.filter(o => o.status !== "取消");

      let totalSales = 0;
      let totalDishes = 0;
      let dineInDishes = 0;
      let takeoutDishes = 0;

      const curryCounts = { "チキン": 0, "ポーク": 0, "限定": 0 };
      let largeRiceCount = 0;
      const toppingCounts = {};

      validOrders.forEach(o => {
        totalSales += (o.totalPrice || 0);
        o.dishes.forEach(d => {
          totalDishes++;
          if (d.type === "店内") dineInDishes++;
          if (d.type === "持ち帰り") takeoutDishes++;

          if (curryCounts[d.curry] !== undefined) {
            curryCounts[d.curry]++;
          }
          if (d.rice === "大盛") largeRiceCount++;

          const additions = [...(d.toppings || []), ...(d.drinks || [])];
          additions.forEach(item => {
            toppingCounts[item] = (toppingCounts[item] || 0) + 1;
          });
        });
      });

      // KPI更新
      document.getElementById("kpi-total-sales").innerText = totalSales.toLocaleString();
      document.getElementById("kpi-order-count").innerText = validOrders.length;
      document.getElementById("kpi-dish-count").innerText = totalDishes;
      document.getElementById("kpi-avg-price").innerText = validOrders.length > 0 ? Math.round(totalSales / validOrders.length).toLocaleString() : 0;
      document.getElementById("kpi-dinein-count").innerText = dineInDishes;
      document.getElementById("kpi-takeout-count").innerText = takeoutDishes;
      document.getElementById("kpi-dinein-rate").innerText = totalDishes > 0 ? Math.round((dineInDishes / totalDishes) * 100) : 0;
      document.getElementById("kpi-takeout-rate").innerText = totalDishes > 0 ? Math.round((takeoutDishes / totalDishes) * 100) : 0;
      document.getElementById("disp-order-total-count").innerText = `(全${orders.length}件)`;

      // カレー別テーブル描画
      const tbodyCurry = document.getElementById("tbody-curry-summary");
      tbodyCurry.innerHTML = "";
      ["チキン", "ポーク", "限定"].forEach(cName => {
        const cnt = curryCounts[cName] || 0;
        const price = MENU_PRICES[cName] || 0;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="py-2.5 px-3 font-sans font-bold text-slate-800">${cName}カレー</td>
          <td class="py-2.5 px-3 text-right text-slate-500">¥${price.toLocaleString()}</td>
          <td class="py-2.5 px-3 text-right font-bold">${cnt}</td>
          <td class="py-2.5 px-3 text-right font-bold text-slate-900">¥${(cnt * price).toLocaleString()}</td>
        `;
        tbodyCurry.appendChild(tr);
      });

      // ライス大盛行
      const trRice = document.createElement("tr");
      trRice.innerHTML = `
        <td class="py-2.5 px-3 font-sans font-bold text-blue-800">ライスの大盛</td>
        <td class="py-2.5 px-3 text-right text-slate-500">+¥${MENU_PRICES["大盛"]}</td>
        <td class="py-2.5 px-3 text-right font-bold">${largeRiceCount}</td>
        <td class="py-2.5 px-3 text-right font-bold text-slate-900">¥${(largeRiceCount * MENU_PRICES["大盛"]).toLocaleString()}</td>
      `;
      tbodyCurry.appendChild(trRice);

      // トッピング別テーブル描画
      const tbodyTopping = document.getElementById("tbody-toppings-summary");
      tbodyTopping.innerHTML = "";
      const topKeys = Object.keys(toppingCounts);
      if (topKeys.length === 0) {
        tbodyTopping.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400 font-sans">トッピング注文はありません</td></tr>`;
      } else {
        topKeys.forEach(tName => {
          const cnt = toppingCounts[tName];
          const price = MENU_PRICES[tName] || 0;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="py-2.5 px-3 font-sans font-medium text-slate-800">${tName}</td>
            <td class="py-2.5 px-3 text-right text-slate-500">¥${price.toLocaleString()}</td>
            <td class="py-2.5 px-3 text-right font-bold">${cnt}</td>
            <td class="py-2.5 px-3 text-right font-bold text-slate-900">¥${(cnt * price).toLocaleString()}</td>
          `;
          tbodyTopping.appendChild(tr);
        });
      }

      // 明細テーブル描画
      const tbodyDetails = document.getElementById("tbody-order-details");
      tbodyDetails.innerHTML = "";
      orders.forEach(order => {
        const isCancel = order.status === "取消";
        const tr = document.createElement("tr");
        tr.className = `border-b border-slate-100 ${isCancel ? 'opacity-40 bg-slate-50 line-through' : ''}`;

        const dishesHtml = order.dishes.map(d => {
          const adds = [...(d.toppings || []), ...(d.drinks || [])];
          return `
            <div class="text-[11px] flex items-center gap-1.5 flex-wrap">
              <span class="font-bold text-slate-900">${d.curry}</span>
              <span class="text-[10px] text-slate-500">(${d.rice}/${d.spicy})</span>
              <span class="text-[9px] bg-slate-100 px-1 py-0.2 rounded border border-slate-200 font-medium">${d.type}</span>
              ${adds.length > 0 ? `<span class="text-[10px] text-amber-800 font-bold">+${adds.join(',')}</span>` : ''}
            </div>
          `;
        }).join('');

        tr.innerHTML = `
          <td class="py-2.5 px-3 font-mono font-bold text-slate-900">${String(order.id).padStart(3, '0')}</td>
          <td class="py-2.5 px-3">
            ${order.name ? `<span class="font-bold text-slate-800">${order.name} 様</span>` : `<span class="text-slate-400">-</span>`}
            ${order.phone ? `<span class="block text-[10px] text-slate-400 font-mono">${order.phone}</span>` : ''}
          </td>
          <td class="py-2.5 px-3 font-mono text-slate-700">${order.slot}</td>
          <td class="py-2.5 px-3 space-y-0.5">${dishesHtml}</td>
          <td class="py-2.5 px-3 text-center">
            <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold ${order.status === '済' ? 'bg-emerald-100 text-emerald-800' : order.status === '取消' ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-700'}">
              ${order.status}
            </span>
          </td>
          <td class="py-2.5 px-3 text-right font-mono font-bold text-slate-900">¥${(order.totalPrice || 0).toLocaleString()}</td>
        `;
        tbodyDetails.appendChild(tr);
      });

      // アイコン再レンダリング
      lucide.createIcons();
    }

    function triggerPrintPDF() {
      window.print();
    }

    window.onload = () => {
      init();
      lucide.createIcons();
    };
  </script>
</body>
</html>
